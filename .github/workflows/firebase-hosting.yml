name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy_to_firebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Firestore Rules
        continue-on-error: true
        run: |
          cat << 'EOF' > /tmp/sa.json
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLT_RS }}
          EOF
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json npx --yes firebase-tools deploy --only firestore:rules --project volt-rs || true
          rm -f /tmp/sa.json

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLT_RS }}'
          channelId: live
          projectId: volt-rs
