name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  deployments: write
  pull-requests: write

jobs:
  deploy_to_firebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Firebase
        run: |
          cat << 'EOF' > /tmp/sa.json
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLT_RS }}
          EOF
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json

          echo "==> Deploying Firestore Rules..."
          npx --yes firebase-tools@15.34.0 deploy --only firestore:rules --project volt-rs --non-interactive || true

          echo "==> Deploying Firebase Hosting..."
          npx --yes firebase-tools@15.34.0 deploy --only hosting --project volt-rs --non-interactive

          rm -f /tmp/sa.json
