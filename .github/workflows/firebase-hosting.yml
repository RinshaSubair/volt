name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy_to_firebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting (Service Account)
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLT_RS != '' }}"
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLT_RS }}'
          channelId: live
          projectId: volt-rs

      - name: Fallback Deploy (Firebase CLI Token)
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLT_RS == '' && secrets.FIREBASE_TOKEN != '' }}"
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project volt-rs
