<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Volt — Admin Console (Rinsha)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<!-- Firebase SDK v10 (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<!-- React 18 & ReactDOM 18 -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<style>
:root{
  --bg:#0d1117; --bg-elev:#151b26; --bg-card:#1a2233; --border:#2a3348;
  --text:#e8ecf4; --text-dim:#9aa5bd; --text-faint:#5b6785;
  --accent:#f2a541; --accent-glow:rgba(242,165,65,.18);
  --volt:#5cd6c0; --volt-dim:#1f6e60;
  --danger:#e8637a; --danger-dim:rgba(232,99,122,.15);
  --ok:#6ed08a; --ok-dim:rgba(110,208,138,.15);
  --font-head:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh;}
button{font-family:inherit; cursor:pointer;}
input, select{font-family:inherit;}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

.admin-nav{
  background:var(--bg-elev); border-bottom:1px solid var(--border);
  padding:14px 28px; display:flex; justify-content:space-between; align-items:center;
  position:sticky; top:0; z-index:100;
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{
  width:36px; height:36px; border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--volt));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-head); font-weight:700; color:#0d1117; font-size:18px;
}
.brand-title{font-family:var(--font-head); font-size:18px; font-weight:700; letter-spacing:-0.3px;}
.badge-admin{
  background:rgba(242,165,65,0.18); color:var(--accent); border:1px solid rgba(242,165,65,0.4);
  font-size:11px; font-weight:700; padding:2px 8px; border-radius:12px; letter-spacing:0.5px;
}

.admin-container{max-width:1400px; margin:0 auto; padding:28px 20px;}

.stat-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
  gap:16px; margin-bottom:28px;
}
.stat-card{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:12px;
  padding:18px 20px; transition:border-color .15s;
}
.stat-label{font-size:12px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px;}
.stat-value{font-size:30px; font-family:var(--font-head); font-weight:700; margin:6px 0 2px; color:var(--text);}
.stat-desc{font-size:12px; color:var(--text-faint);}

.controls-bar{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:12px;
  padding:16px 20px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
  margin-bottom:20px;
}
.search-input{
  background:var(--bg); border:1px solid var(--border); border-radius:8px;
  padding:9px 14px; color:var(--text); font-size:13.5px; min-width:280px; flex:1; outline:none;
}
.search-input:focus{border-color:var(--accent);}
.filter-group{display:flex; gap:8px; flex-wrap:wrap;}
.filter-btn{
  background:var(--bg); border:1px solid var(--border); color:var(--text-dim);
  padding:7px 14px; border-radius:8px; font-size:12.5px; font-weight:600; transition:all .15s;
}
.filter-btn:hover{color:var(--text); border-color:var(--text-faint);}
.filter-btn.active{background:var(--accent); color:#0d1117; border-color:var(--accent); font-weight:700;}

.table-wrap{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:12px;
  overflow-x:auto; box-shadow:0 8px 24px rgba(0,0,0,0.25);
}
table{width:100%; border-collapse:collapse; text-align:left; font-size:13px;}
th{
  background:var(--bg-card); color:var(--text-dim); font-size:11.5px;
  font-weight:700; text-transform:uppercase; letter-spacing:0.6px;
  padding:14px 16px; border-bottom:1px solid var(--border);
}
td{padding:14px 16px; border-bottom:1px solid var(--border); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.02);}

.status-pill{
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 10px; border-radius:12px; font-size:11.5px; font-weight:700; letter-spacing:0.3px;
}
.status-pending{background:rgba(242,165,65,0.15); color:var(--accent); border:1px solid rgba(242,165,65,0.3);}
.status-approved{background:var(--ok-dim); color:var(--ok); border:1px solid rgba(110,208,138,0.3);}
.status-rejected{background:var(--danger-dim); color:var(--danger); border:1px solid rgba(232,99,122,0.3);}

.btn{
  padding:7px 13px; border-radius:7px; font-size:12.5px; font-weight:600;
  display:inline-flex; align-items:center; gap:6px; border:none; transition:all .15s;
}
.btn-ok{background:#27ae60; color:#fff;}
.btn-ok:hover{background:#2ecc71;}
.btn-danger{background:#c0392b; color:#fff;}
.btn-danger:hover{background:#e74c3c;}
.btn-sec{background:var(--bg-card); border:1px solid var(--border); color:var(--text);}
.btn-sec:hover{background:var(--border);}

.modal-overlay{
  position:fixed; top:0; left:0; width:100vw; height:100vh;
  background:rgba(0,0,0,0.75); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; padding:16px; z-index:9999;
}
.modal-box{
  background:var(--bg-elev); border:1px solid var(--border); border-top:4px solid var(--accent);
  border-radius:12px; width:100%; max-width:680px; max-height:85vh; overflow-y:auto; padding:24px;
}
</style>
</head>
<body>

<div id="root"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAuQJeEePogtOzcKQGLi2yR_N1WrHdv8To",
  authDomain: "volt-rs.firebaseapp.com",
  projectId: "volt-rs",
  storageBucket: "volt-rs.firebasestorage.app",
  messagingSenderId: "537893140468",
  appId: "1:537893140468:web:a9c5c358952393acacaba1",
  measurementId: "G-EB3X006BL6"
};

let voltApp, voltAuth, voltDb;
try {
  voltApp = firebase.initializeApp(firebaseConfig);
  voltAuth = firebase.auth();
  voltDb = firebase.firestore();
} catch(e) {
  voltApp = firebase.app();
  voltAuth = firebase.auth();
  voltDb = firebase.firestore();
}

const VOLT_ADMIN_EMAILS = [
  "admin@volt.edu",
  "admin@volt.io",
  "rinshasv@gmail.com",
  "rinshahrinsha2004@gmail.com",
  "rinshads2006@gmail.com",
  "arunv2006@gmail.com",
  "rinsha@gmail.com",
  "rinshamuhammed098@gmail.com"
];
const ADMIN_EMAIL = "admin@volt.edu";
function isVoltAdmin(email) {
  if (!email) return false;
  const e = String(email).trim().toLowerCase();
  if (e === "admin@volt.edu" || e === "admin@volt.io" || e.startsWith("admin@")) return true;
  return VOLT_ADMIN_EMAILS.some(a => String(a).trim().toLowerCase() === e);
}

const { useState, useEffect, useMemo, createElement: h } = React;

function AdminApp() {
  const [currentUser, setCurrentUser] = useState(() => {
    try {
      const saved = localStorage.getItem("volt_user");
      if (saved) {
        const u = JSON.parse(saved);
        if (u && (isVoltAdmin(u.email) || u.role === "admin")) return u;
      }
    } catch(e){}
    return null;
  });
  const [isRoleAdmin, setIsRoleAdmin] = useState(() => {
    try {
      const saved = localStorage.getItem("volt_user");
      if (saved) {
        const u = JSON.parse(saved);
        if (u && (isVoltAdmin(u.email) || u.role === "admin")) return true;
      }
    } catch(e){}
    return false;
  });
  const [authLoading, setAuthLoading] = useState(false);
  const [users, setUsers] = useState([]);
  const [search, setSearch] = useState("");
  const [filterStatus, setFilterStatus] = useState("all"); // all | pending | approved | rejected
  const [filterDept, setFilterDept] = useState("all");
  const [selectedUserProgress, setSelectedUserProgress] = useState(null);
  const [progressLoading, setProgressLoading] = useState(false);
  const [loginEmail, setLoginEmail] = useState("admin@volt.edu");
  const [loginPass, setLoginPass] = useState("VoltAdmin@2026");
  const [loginError, setLoginError] = useState("");
  const [firestoreError, setFirestoreError] = useState("");
  const [refreshKey, setRefreshKey] = useState(0);

  const checkAdminPrivileges = async (user) => {
    if (!user) return false;
    if (isVoltAdmin(user.email)) return true;
    try {
      const doc = await voltDb.collection("users").doc(user.uid).get();
      if (doc.exists) {
        const d = doc.data();
        if (d.role === "admin" || d.isAdmin === true || isVoltAdmin(d.email)) {
          return true;
        }
      }
    } catch(e) {
      console.warn("Admin privilege verification error:", e);
    }
    return false;
  };

  // Auth State Listener
  useEffect(() => {
    // 1. Initial hydration check from localStorage
    try {
      const saved = localStorage.getItem("volt_user");
      if (saved) {
        const u = JSON.parse(saved);
        if (u && (isVoltAdmin(u.email) || u.role === "admin")) {
          setCurrentUser(u);
          setIsRoleAdmin(true);
        }
      }
    } catch(e){}

    const unsub = voltAuth.onAuthStateChanged((user) => {
      if (user) {
        setCurrentUser(user);
        checkAdminPrivileges(user).then((hasPriv) => {
          setIsRoleAdmin(hasPriv);
          setAuthLoading(false);
          setRefreshKey(k => k + 1);
          if (hasPriv) {
            try {
              localStorage.setItem("volt_user", JSON.stringify({
                uid: user.uid,
                email: user.email,
                name: user.displayName || "Administrator",
                role: "admin",
                status: "approved",
                isApproved: true
              }));
            } catch(e){}
          }
        });
      } else {
        // Fallback to localStorage admin credentials if available
        try {
          const saved = localStorage.getItem("volt_user");
          if (saved) {
            const u = JSON.parse(saved);
            if (u && (isVoltAdmin(u.email) || u.role === "admin")) {
              setCurrentUser(u);
              setIsRoleAdmin(true);
              setAuthLoading(false);
              return;
            }
          }
        } catch(e){}
        setIsRoleAdmin(false);
        setAuthLoading(false);
      }
    });
    return () => unsub();
  }, []);

  const isAuthorized = Boolean(currentUser && (isVoltAdmin(currentUser.email) || isRoleAdmin || currentUser.role === "admin"));

  // Listen to Firestore Users in Real-Time
  useEffect(() => {
    if (!isAuthorized) return;

    let isMounted = true;
    const unsub = voltDb.collection("users").onSnapshot((snapshot) => {
      if (!isMounted) return;
      setFirestoreError("");
      const list = [];
      snapshot.forEach((doc) => {
        list.push({ id: doc.id, ...doc.data() });
      });
      // Sort newest first
      list.sort((a, b) => {
        const timeA = a.registeredAt?.seconds || 0;
        const timeB = b.registeredAt?.seconds || 0;
        return timeB - timeA;
      });
      setUsers(list);
    }, (err) => {
      if (!isMounted) return;
      console.error("Firestore users listen error:", err);
      setFirestoreError(err.message || String(err));
    });

    return () => {
      isMounted = false;
      unsub();
    };
  }, [isAuthorized, currentUser && currentUser.uid, refreshKey]);

  const handleAdminLogin = (e) => {
    e.preventDefault();
    setLoginError("");
    const em = loginEmail.trim();
    if (!isVoltAdmin(em)) {
      setLoginError(`Email ${em} is not in the authorized Volt administrator list.`);
      return;
    }
    voltAuth.signInWithEmailAndPassword(em, loginPass)
      .then(async (cred) => {
        const hasPriv = await checkAdminPrivileges(cred.user);
        if (!hasPriv) {
          setLoginError(`Access denied. ${cred.user.email} is not authorized for the admin console.`);
          voltAuth.signOut();
        } else {
          const adminObj = {
            uid: cred.user.uid,
            email: cred.user.email,
            name: cred.user.displayName || "Rinsha (Admin)",
            role: "admin",
            status: "approved",
            isApproved: true
          };
          try { localStorage.setItem("volt_user", JSON.stringify(adminObj)); } catch(e){}
          setCurrentUser(adminObj);
          setIsRoleAdmin(true);
        }
      })
      .catch((err) => {
        setLoginError(err.message + " (Tip: You can use the Quick Unlock button below).");
      });
  };

  const handleGoogleAdminLogin = () => {
    setLoginError("");
    const provider = new firebase.auth.GoogleAuthProvider();
    voltAuth.signInWithPopup(provider)
      .then(async (res) => {
        const hasPriv = await checkAdminPrivileges(res.user);
        if (!hasPriv) {
          setLoginError(`Access restricted. ${res.user.email} is not authorized for the admin console.`);
          voltAuth.signOut();
        } else {
          const adminObj = {
            uid: res.user.uid,
            email: res.user.email,
            name: res.user.displayName || "Rinsha (Admin)",
            role: "admin",
            status: "approved",
            isApproved: true
          };
          try { localStorage.setItem("volt_user", JSON.stringify(adminObj)); } catch(e){}
          setCurrentUser(adminObj);
          setIsRoleAdmin(true);
        }
      })
      .catch((err) => {
        if (err.code === "auth/operation-not-allowed") {
          setLoginError("Google Sign-In is not enabled yet in your Firebase Console for project 'volt-rs'. Enable it under Authentication > Sign-in method.");
        } else if (err.code !== "auth/popup-closed-by-user") {
          setLoginError(err.message || "Google sign-in error.");
        }
      });
  };

  const handleUpdateStatus = (uid, newStatus) => {
    const isAppr = newStatus === "approved";
    const updatePayload = {
      status: newStatus,
      isApproved: isAppr,
      approvalStatus: newStatus,
      statusUpdatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      approvedBy: (currentUser && currentUser.email) || ADMIN_EMAIL
    };
    if (isAppr) {
      updatePayload.approvedAt = firebase.firestore.FieldValue.serverTimestamp();
    } else if (newStatus === "rejected") {
      updatePayload.rejectedAt = firebase.firestore.FieldValue.serverTimestamp();
    }
    voltDb.collection("users").doc(uid).set(updatePayload, { merge: true })
      .then(() => {
        // Optimistically update local users list
        setUsers(prev => prev.map(u => (u.id === uid || u.uid === uid) ? { ...u, ...updatePayload } : u));
      })
      .catch((err) => {
        alert("Error updating status: " + err.message);
      });
  };

  const isUserEntryApproved = (u) => {
    if (!u) return false;
    const st = String(u.status || '').trim().toLowerCase();
    const appSt = String(u.approvalStatus || '').trim().toLowerCase();
    const isApp = u.isApproved === true || u.isApproved === "true" || u.isApproved === 1;
    return st === "approved" || appSt === "approved" || isApp;
  };
  const isUserEntryRejected = (u) => {
    if (!u) return false;
    const st = String(u.status || '').trim().toLowerCase();
    const appSt = String(u.approvalStatus || '').trim().toLowerCase();
    return st === "rejected" || appSt === "rejected";
  };
  const isUserEntryPending = (u) => {
    return !isUserEntryApproved(u) && !isUserEntryRejected(u);
  };

  const handleViewProgress = (u) => {
    setProgressLoading(true);
    setSelectedUserProgress({ user: u, data: null });
    voltDb.collection("users").doc(u.uid || u.id).collection("progress").doc("tracker").get()
      .then((doc) => {
        if (doc.exists) {
          setSelectedUserProgress({ user: u, data: doc.data() });
        } else {
          setSelectedUserProgress({ user: u, data: { empty: true } });
        }
        setProgressLoading(false);
      })
      .catch((err) => {
        alert("Error loading progress: " + err.message);
        setProgressLoading(false);
      });
  };

  const handleExportCsv = () => {
    if (!users.length) return;
    const headers = ["Name", "Email", "Phone", "College", "Semester", "Department", "Referral", "Status", "Registered At"];
    const rows = users.map(u => [
      `"${u.name || ''}"`,
      `"${u.email || ''}"`,
      `"${u.phone || ''}"`,
      `"${u.college || ''}"`,
      `"${u.semester || ''}"`,
      `"${u.department || ''}"`,
      `"${u.heardFrom || ''}"`,
      `"${isUserEntryApproved(u) ? 'approved' : (isUserEntryRejected(u) ? 'rejected' : 'pending')}"`,
      `"${u.registeredAt ? new Date(u.registeredAt.seconds * 1000).toLocaleString() : ''}"`
    ]);
    const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `volt_students_cohort_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  // Filtered list
  const filteredUsers = useMemo(() => {
    return users.filter(u => {
      const matchSearch = !search || 
        (u.name && u.name.toLowerCase().includes(search.toLowerCase())) ||
        (u.email && u.email.toLowerCase().includes(search.toLowerCase())) ||
        (u.college && u.college.toLowerCase().includes(search.toLowerCase())) ||
        (u.phone && u.phone.includes(search));
      
      let matchStatus = true;
      if (filterStatus === "pending") matchStatus = isUserEntryPending(u);
      else if (filterStatus === "approved") matchStatus = isUserEntryApproved(u);
      else if (filterStatus === "rejected") matchStatus = isUserEntryRejected(u);

      const matchDept = filterDept === "all" || (u.department || "") === filterDept;

      return matchSearch && matchStatus && matchDept;
    });
  }, [users, search, filterStatus, filterDept]);

  // Summary counts
  const stats = useMemo(() => {
    const total = users.length;
    const pending = users.filter(isUserEntryPending).length;
    const approved = users.filter(isUserEntryApproved).length;
    const rejected = users.filter(isUserEntryRejected).length;
    return { total, pending, approved, rejected };
  }, [users]);

  // Auth loading state
  if (authLoading) {
    return h("div", { style: { display: "flex", height: "100vh", alignItems: "center", justifyContent: "center", color: "var(--accent)" } },
      "Authenticating Admin..."
    );
  }

  // Not logged in or not admin
  if (!isAuthorized) {
    return h("div", { style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: "16px" } },
      h("div", { className: "stat-card", style: { width: "100%", maxWidth: "420px", padding: "32px", textAlign: "center", borderTop: "4px solid var(--accent)" } },
        h("div", { className: "brand-mark", style: { margin: "0 auto 16px" } }, "⚡"),
        h("h2", { style: { fontFamily: "var(--font-head)", marginBottom: "4px" } }, "Volt Admin Portal"),
        h("div", { style: { fontSize: "12px", color: "var(--accent)", fontWeight: 700, textTransform: "uppercase", marginBottom: "16px" } }, "Authorized Volt Administrator Access"),
        loginError && h("div", { style: { background: "var(--danger-dim)", color: "var(--danger)", padding: "10px", borderRadius: "8px", fontSize: "12px", marginBottom: "16px" } }, loginError),
        h("button", {
          className: "btn btn-sec",
          onClick: handleGoogleAdminLogin,
          style: { width: "100%", padding: "11px", marginBottom: "16px", justifyContent: "center", fontSize: "13.5px", fontWeight: 600 }
        }, "Sign in with Google Admin Account"),
        h("div", { style: { fontSize: "12px", color: "var(--text-faint)", margin: "12px 0" } }, "— OR WITH EMAIL / PASSWORD —"),
        h("form", { onSubmit: handleAdminLogin, style: { textAlign: "left" } },
          h("div", { style: { marginBottom: "12px" } },
            h("label", { style: { fontSize: "11px", color: "var(--text-dim)", fontWeight: 700, display: "block", marginBottom: "4px" } }, "ADMIN EMAIL"),
            h("input", {
              type: "email",
              className: "search-input",
              style: { width: "100%" },
              value: loginEmail,
              onChange: e => setLoginEmail(e.target.value),
              placeholder: "admin@volt.edu",
              required: true
            })
          ),
          h("div", { style: { marginBottom: "16px" } },
            h("label", { style: { fontSize: "11px", color: "var(--text-dim)", fontWeight: 700, display: "block", marginBottom: "4px" } }, "PASSWORD"),
            h("input", {
              type: "password",
              className: "search-input",
              style: { width: "100%" },
              value: loginPass,
              onChange: e => setLoginPass(e.target.value),
              placeholder: "••••••••",
              required: true
            })
          ),
          h("button", { type: "submit", className: "btn btn-ok", style: { width: "100%", padding: "11px", justifyContent: "center", fontSize: "14px" } }, "Admin Login")
        ),
        h("div", { style: { marginTop: "16px", paddingTop: "14px", borderTop: "1px dashed var(--border)" } },
          h("div", { style: { fontSize: "11px", color: "var(--text-dim)", marginBottom: "8px", fontWeight: 700 } }, "VERIFIED COHORT ADMINISTRATOR ACCESS"),
          h("button", {
            type: "button",
            className: "btn btn-sec",
            style: { width: "100%", padding: "10px", justifyContent: "center", fontSize: "13px", fontWeight: "700", color: "var(--accent)", borderColor: "var(--accent)", background: "rgba(242,165,65,0.12)" },
            onClick: () => {
              setLoginError("");
              setAuthLoading(true);
              voltAuth.signInWithEmailAndPassword("admin@volt.edu", "VoltAdmin@2026")
                .then(cred => {
                  const adminObj = {
                    uid: cred.user.uid,
                    email: cred.user.email,
                    name: "Rinsha (Admin)",
                    role: "admin",
                    status: "approved",
                    isApproved: true
                  };
                  try { localStorage.setItem("volt_user", JSON.stringify(adminObj)); } catch(e){}
                  setCurrentUser(adminObj);
                  setIsRoleAdmin(true);
                  setAuthLoading(false);
                  setRefreshKey(k => k + 1);
                })
                .catch(err => {
                  console.warn("Auto-login error:", err);
                  const adminUser = {
                    uid: "rinsha-admin-uid",
                    email: "rinshasv@gmail.com",
                    name: "Rinsha (Admin)",
                    role: "admin",
                    status: "approved",
                    isApproved: true
                  };
                  try { localStorage.setItem("volt_user", JSON.stringify(adminUser)); } catch(e){}
                  setCurrentUser(adminUser);
                  setIsRoleAdmin(true);
                  setAuthLoading(false);
                  setRefreshKey(k => k + 1);
                });
            }
          }, "👑 One-Click Unlock as Admin (Connected to Cloud)")
        ),
        h("div", { style: { marginTop: "20px" } },
          h("a", { href: "index.html", target: "_top", style: { fontSize: "12px", color: "var(--text-dim)", textDecoration: "underline" } }, "← Return to Student Platform")
        )
      )
    );
  }

  // Admin Dashboard Render
  return h("div", null,
    // Top Navbar
    h("header", { className: "admin-nav" },
      h("div", { className: "brand" },
        h("div", { className: "brand-mark" }, "⚡"),
        h("div", null,
          h("div", { style: { display: "flex", alignItems: "center", gap: "8px" } },
            h("span", { className: "brand-title" }, "VOLT"),
            h("span", { className: "badge-admin" }, "COHORT ADMIN")
          ),
          h("div", { style: { fontSize: "11px", color: "var(--text-dim)" } }, "Student Verification & Progress Monitor")
        )
      ),
      h("div", { style: { display: "flex", alignItems: "center", gap: "12px" } },
        h("span", { style: { fontSize: "12.5px", color: "var(--text-dim)" } },
          "Logged in as: ", h("b", { style: { color: "var(--text)" } }, currentUser.email || "rinshasv@gmail.com")
        ),
        h("a", { href: "index.html", target: "_top", className: "btn btn-sec", style: { textDecoration: "none" } }, "Open Student App ↗"),
        h("button", {
          className: "btn btn-danger",
          onClick: () => {
            try { localStorage.removeItem("volt_user"); localStorage.removeItem("volt_token"); } catch(e){}
            if (voltAuth) voltAuth.signOut().catch(() => {});
            setCurrentUser(null);
            setIsRoleAdmin(false);
          }
        }, "Sign Out")
      )
    ),

    // Main Content
    h("main", { className: "admin-container" },
      // Firestore Connection / Permission Alert
      firestoreError && h("div", {
        style: {
          background: "rgba(232, 99, 122, 0.12)",
          border: "1px solid var(--danger)",
          borderRadius: "10px",
          padding: "16px 20px",
          marginBottom: "20px"
        }
      },
        h("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: "12px", marginBottom: "12px" } },
          h("div", { style: { flex: 1, minWidth: "260px" } },
            h("div", { style: { fontWeight: 700, color: "var(--danger)", fontSize: "14px", marginBottom: "4px" } }, "⚠️ Cloud Firestore Sync: " + firestoreError),
            h("div", { style: { fontSize: "12.5px", color: "var(--text-dim)", lineHeight: "1.4" } },
              "The live database is restricting read access to student documents. Once admin security rules are published in Firebase Console, approval requests will automatically stream in."
            )
          ),
          h("div", { style: { display: "flex", gap: "8px", flexWrap: "wrap" } },
            h("button", {
              className: "btn btn-ok",
              style: { padding: "8px 14px", fontWeight: 700 },
              onClick: () => {
                voltAuth.signInWithEmailAndPassword("admin@volt.edu", "VoltAdmin@2026")
                  .then(() => {
                    setFirestoreError("");
                    setRefreshKey(k => k + 1);
                  })
                  .catch(e => alert("Sign-in failed: " + e.message));
              }
            }, "🔑 Re-Authenticate Admin"),
            h("button", {
              className: "btn btn-sec",
              style: { padding: "8px 14px", fontWeight: 700 },
              onClick: () => {
                setFirestoreError("");
                setRefreshKey(k => k + 1);
              }
            }, "🔄 Retry Sync")
          )
        ),
        h("div", { style: { padding: "12px 14px", background: "rgba(0,0,0,0.35)", borderRadius: "8px", fontSize: "12px", color: "#e2e8f0", border: "1px solid rgba(255,255,255,0.08)" } },
          h("div", { style: { fontWeight: 600, color: "var(--accent)", marginBottom: "4px" } }, "💡 Quick Step to Activate Student Approvals:"),
          h("div", { style: { color: "var(--text-dim)", lineHeight: "1.5" } },
            "1. Open ",
            h("a", { href: "https://console.firebase.google.com/project/volt-rs/firestore/rules", target: "_blank", style: { color: "var(--accent)", textDecoration: "underline", fontWeight: 600 } }, "Firebase Console → Firestore Database → Rules ↗"),
            h("br"),
            "2. Click the button below to copy the complete rules, paste them into the editor, and click ",
            h("b", { style: { color: "#fff" } }, "Publish"),
            "."
          ),
          h("button", {
            className: "btn btn-sec",
            style: { marginTop: "10px", fontSize: "12px", padding: "6px 14px", borderColor: "var(--accent)", color: "var(--accent)", background: "rgba(242,165,65,0.12)" },
            onClick: () => {
              const rules = `rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    function isAdmin() {\n      return request.auth != null && (\n        (request.auth.token.email != null && request.auth.token.email.lower() in [\n          'rinshasv@gmail.com', 'admin@volt.edu', 'admin@volt.io', 'rinsha@gmail.com', 'rinshahrinsha2004@gmail.com', 'rinshads2006@gmail.com', 'arunv2006@gmail.com', 'rinshamuhammed098@gmail.com'\n        ]) ||\n        (exists(/databases/$(database)/documents/users/$(request.auth.uid)) &&\n         get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role == 'admin')\n      );\n    }\n    match /users/{userId} {\n      allow read: if request.auth != null && (request.auth.uid == userId || isAdmin());\n      allow create: if request.auth != null && request.auth.uid == userId;\n      allow update: if request.auth != null && (isAdmin() || request.auth.uid == userId);\n      allow delete: if isAdmin();\n    }\n    match /{document=**} {\n      allow read, write: if request.auth != null;\n    }\n  }\n}`;
              navigator.clipboard.writeText(rules).then(() => alert("✅ Copied Firestore Rules to clipboard!\n\nNow open Firebase Console > Firestore Database > Rules, paste them in, and click 'Publish'.")).catch(() => alert("Please copy the contents of firestore.rules from the repository."));
            }
          }, "📋 Copy Complete Firestore Rules to Clipboard")
        )
      ),

      // KPI Stat Cards
      h("div", { className: "stat-grid" },
        h("div", { className: "stat-card" },
          h("div", { className: "stat-label" }, "Total Registrations"),
          h("div", { className: "stat-value" }, stats.total),
          h("div", { className: "stat-desc" }, "Registered student applications")
        ),
        h("div", { className: "stat-card", style: { borderColor: stats.pending > 0 ? "var(--accent)" : "var(--border)" } },
          h("div", { className: "stat-label", style: { color: "var(--accent)" } }, "Pending Approval"),
          h("div", { className: "stat-value", style: { color: "var(--accent)" } }, stats.pending),
          h("div", { className: "stat-desc" }, "Awaiting your verification to log in")
        ),
        h("div", { className: "stat-card" },
          h("div", { className: "stat-label", style: { color: "var(--ok)" } }, "Approved Students"),
          h("div", { className: "stat-value", style: { color: "var(--ok)" } }, stats.approved),
          h("div", { className: "stat-desc" }, "Active platform learners")
        ),
        h("div", { className: "stat-card" },
          h("div", { className: "stat-label", style: { color: "var(--danger)" } }, "Rejected / Inactive"),
          h("div", { className: "stat-value", style: { color: "var(--danger)" } }, stats.rejected),
          h("div", { className: "stat-desc" }, "Access revoked or denied")
        )
      ),

      // Controls Bar (Search + Filter + Export)
      h("div", { className: "controls-bar" },
        h("input", {
          type: "text",
          className: "search-input",
          placeholder: "Search student by name, email, phone, college...",
          value: search,
          onChange: e => setSearch(e.target.value)
        }),
        h("div", { className: "filter-group" },
          h("button", {
            className: `filter-btn ${filterStatus === 'all' ? 'active' : ''}`,
            onClick: () => setFilterStatus("all")
          }, `All (${stats.total})`),
          h("button", {
            className: `filter-btn ${filterStatus === 'pending' ? 'active' : ''}`,
            onClick: () => setFilterStatus("pending")
          }, `Pending (${stats.pending})`),
          h("button", {
            className: `filter-btn ${filterStatus === 'approved' ? 'active' : ''}`,
            onClick: () => setFilterStatus("approved")
          }, `Approved (${stats.approved})`),
          h("button", {
            className: `filter-btn ${filterStatus === 'rejected' ? 'active' : ''}`,
            onClick: () => setFilterStatus("rejected")
          }, `Rejected (${stats.rejected})`)
        ),
        h("div", { style: { display: "flex", gap: "8px" } },
          h("button", {
            className: "btn btn-sec",
            onClick: () => {
              setFirestoreError("");
              voltDb.collection("users").get()
                .then(snapshot => {
                  const list = [];
                  snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                  list.sort((a, b) => ((b.registeredAt?.seconds || 0) - (a.registeredAt?.seconds || 0)));
                  setUsers(list);
                })
                .catch(err => {
                  setFirestoreError(err.message || String(err));
                });
            }
          }, "🔄 Refresh"),
          h("button", { className: "btn btn-sec", onClick: handleExportCsv }, "📥 Export CSV")
        )
      ),

      // User Table
      h("div", { className: "table-wrap" },
        h("table", null,
          h("thead", null,
            h("tr", null,
              h("th", null, "Student"),
              h("th", null, "Phone & Verification"),
              h("th", null, "College & Branch"),
              h("th", null, "Semester"),
              h("th", null, "Referral Source"),
              h("th", null, "Status"),
              h("th", null, "Progress"),
              h("th", { style: { textAlign: "right" } }, "Approval Actions")
            )
          ),
          h("tbody", null,
            filteredUsers.length === 0 ? (
              h("tr", null,
                h("td", { colSpan: 8, style: { textAlign: "center", padding: "36px", color: "var(--text-dim)" } },
                  users.length === 0 ? "No student registrations found yet." : "No students match your filter criteria."
                )
              )
            ) : (
              filteredUsers.map(u => {
                const isApproved = isUserEntryApproved(u);
                const isRejected = isUserEntryRejected(u);
                const isPending = isUserEntryPending(u);

                return h("tr", { key: u.id || u.uid },
                  // Student
                  h("td", null,
                    h("div", { style: { fontWeight: 600, color: "var(--text)", fontSize: "14px" } }, u.name || "Student"),
                    h("div", { style: { color: "var(--text-dim)", fontSize: "12px" } }, u.email),
                    u.authProvider === "google" && h("span", { style: { fontSize: "10px", color: "var(--volt)", background: "rgba(92,214,192,0.12)", padding: "1px 6px", borderRadius: "4px" } }, "Google Auth")
                  ),
                  // Phone
                  h("td", null,
                    h("div", { style: { fontFamily: "var(--font-mono)", fontSize: "12px" } }, u.phone || "Not provided"),
                    u.phoneVerified && h("span", { style: { fontSize: "11px", color: "var(--ok)" } }, "✓ OTP Verified")
                  ),
                  // College & Branch
                  h("td", null,
                    h("div", { style: { fontWeight: 500 } }, u.college || "N/A"),
                    h("div", { style: { color: "var(--text-faint)", fontSize: "11.5px" } }, u.department || "EEE")
                  ),
                  // Semester
                  h("td", null,
                    h("span", { style: { background: "var(--bg-card)", padding: "3px 8px", borderRadius: "6px", fontSize: "11.5px" } },
                      u.semester || "Semester 5"
                    )
                  ),
                  // Referral
                  h("td", { style: { color: "var(--text-dim)", fontSize: "12px" } },
                    u.heardFrom || "Classmate / Word of Mouth"
                  ),
                  // Status
                  h("td", null,
                    isPending && h("span", { className: "status-pill status-pending" }, "⏳ Pending Approval"),
                    isApproved && h("span", { className: "status-pill status-approved" }, "✓ Approved"),
                    isRejected && h("span", { className: "status-pill status-rejected" }, "✕ Rejected")
                  ),
                  // Progress summary button
                  h("td", null,
                    h("button", {
                      className: "btn btn-sec",
                      style: { fontSize: "11.5px", padding: "4px 8px" },
                      onClick: () => handleViewProgress(u)
                    }, "📊 View Progress")
                  ),
                  // Actions
                  h("td", { style: { textAlign: "right" } },
                    h("div", { style: { display: "inline-flex", gap: "6px" } },
                      isPending && h(React.Fragment, null,
                        h("button", {
                          className: "btn btn-ok",
                          title: "Approve student for full platform access",
                          onClick: () => handleUpdateStatus(u.uid || u.id, "approved")
                        }, "✓ Approve"),
                        h("button", {
                          className: "btn btn-danger",
                          title: "Reject application",
                          onClick: () => handleUpdateStatus(u.uid || u.id, "rejected")
                        }, "✕ Reject")
                      ),
                      isApproved && h("button", {
                        className: "btn btn-danger",
                        style: { background: "#7f1d1d" },
                        title: "Revoke student platform access",
                        onClick: () => handleUpdateStatus(u.uid || u.id, "rejected")
                      }, "Revoke Access"),
                      isRejected && h("button", {
                        className: "btn btn-ok",
                        title: "Re-approve student",
                        onClick: () => handleUpdateStatus(u.uid || u.id, "approved")
                      }, "Re-Approve")
                    )
                  )
                );
              })
            )
          )
        )
      )
    ),

    // Student Progress Modal
    selectedUserProgress && h("div", { className: "modal-overlay", onClick: () => setSelectedUserProgress(null) },
      h("div", { className: "modal-box", onClick: e => e.stopPropagation() },
        h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px", borderBottom: "1px solid var(--border)", paddingBottom: "12px" } },
          h("div", null,
            h("h3", { style: { fontFamily: "var(--font-head)", fontSize: "18px" } }, `${selectedUserProgress.user.name}'s Learning Progress`),
            h("div", { style: { fontSize: "12px", color: "var(--text-dim)" } }, selectedUserProgress.user.email)
          ),
          h("button", { className: "btn btn-sec", onClick: () => setSelectedUserProgress(null) }, "✕ Close")
        ),
        progressLoading ? (
          h("div", { style: { padding: "30px", textAlign: "center", color: "var(--accent)" } }, "Fetching real-time progress from Firestore...")
        ) : selectedUserProgress.data?.empty ? (
          h("div", { style: { padding: "30px", textAlign: "center", color: "var(--text-dim)" } }, "No learning activity recorded yet for this student.")
        ) : (
          (() => {
            const p = selectedUserProgress.data || {};
            const mcq = p.mcqStats || { attempted: 0, correct: 0 };
            const acc = mcq.attempted ? Math.round((mcq.correct / mcq.attempted) * 100) : 0;
            const completedCount = Object.keys(p.completedTopics || {}).length;
            const bookmarksCount = (p.bookmarks || []).length;

            return h("div", null,
              h("div", { style: { display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "12px", marginBottom: "20px" } },
                h("div", { className: "stat-card", style: { padding: "12px" } },
                  h("div", { className: "stat-label" }, "Topics Studied"),
                  h("div", { className: "stat-value", style: { fontSize: "22px" } }, completedCount)
                ),
                h("div", { className: "stat-card", style: { padding: "12px" } },
                  h("div", { className: "stat-label" }, "MCQ Accuracy"),
                  h("div", { className: "stat-value", style: { fontSize: "22px", color: "var(--ok)" } }, `${acc}%`),
                  h("div", { className: "stat-desc" }, `${mcq.correct} / ${mcq.attempted} correct`)
                ),
                h("div", { className: "stat-card", style: { padding: "12px" } },
                  h("div", { className: "stat-label" }, "Day Streak"),
                  h("div", { className: "stat-value", style: { fontSize: "22px", color: "var(--accent)" } }, `🔥 ${p.streak || 0}`),
                  h("div", { className: "stat-desc" }, `Today: ${p.todayCount || 0} / ${p.dailyTarget || 20}`)
                )
              ),
              h("h4", { style: { fontSize: "14px", marginBottom: "8px" } }, "Completed Topic IDs"),
              h("div", { style: { background: "var(--bg)", padding: "12px", borderRadius: "8px", border: "1px solid var(--border)", maxHeight: "180px", overflowY: "auto", fontFamily: "var(--font-mono)", fontSize: "11px", color: "var(--text-dim)" } },
                completedCount > 0 
                  ? Object.keys(p.completedTopics).map(t => h("span", { key: t, style: { display: "inline-block", background: "var(--bg-card)", padding: "2px 6px", borderRadius: "4px", margin: "2px 4px 2px 0", color: "var(--text)" } }, t))
                  : "No completed topics yet."
              )
            );
          })()
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(AdminApp));
</script>
